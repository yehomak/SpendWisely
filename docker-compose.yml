# Local development — hot reload on both services
# Usage: docker compose up --build
#
# Backend source is mounted as a volume so uvicorn --reload picks up changes.
# Frontend source is mounted so Next.js dev server HMR works.
# DB is persisted in a named volume (survives restarts).

services:
  backend:
    build:
      context: ./v2/backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./v2/backend:/app          # hot reload
      - ./db:/data                  # persist DuckDB file, accessible from host
    environment:
      DB_PATH: /data/spendwisely.duckdb
      SMTP_HOST: mailpit            # OTP confirmation e-mails → Mailpit inbox
      SMTP_PORT: "1025"
    env_file:
      - ./v2/backend/.env          # LLM keys, OWNER_NAME (see .env.example)
    depends_on:
      - mailpit

  # Local mail catcher for OTP confirmation codes — inbox UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"                # SMTP
      - "8025:8025"                # web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  frontend:
    build:
      context: ./v2/frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./v2/frontend:/app         # hot reload
      - /app/node_modules          # keep container node_modules isolated
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1   # browser fetch
      API_URL: http://backend:8000/api/v1                 # SSR fetch (Docker service name)
    depends_on:
      - backend

